[package]
name = "databend-wasm"
version = "0.1.0"
description = "Databend Wasm Client for Browsers"
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }

[lib]
crate-type = ["cdylib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
databend-client = { workspace = true, features = ["rustls"] }
serde_json = "1.0"

console_error_panic_hook = { version = "0.1.7", optional = true }

[dependencies.web-sys]
version = "0.3.77"
features = [
  'Blob',
  'BlobPropertyBag',
  'console',
  'Document',
  'HtmlElement',
  'HtmlInputElement',
  'MessageEvent',
  'Url',
  'Window',
  'Worker',
  'WorkerOptions',
  'WorkerType',
]

[dev-dependencies]
wasm-bindgen-test = "0.3.34"


[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
