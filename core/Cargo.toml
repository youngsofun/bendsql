[package]
name = "databend-client"
description = "Databend Client for Rust"
categories = ["database"]
keywords = ["databend", "database", "sdk"]

version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }

[features]
default = ["rustls"]

# Enable rustls for TLS support
rustls = ["reqwest/rustls-tls"]
# Enable native-tls for TLS support
native-tls = ["reqwest/native-tls"]

[dependencies]
tokio-stream = { workspace = true }

cookie = "0.18.1"
log = "0.4"
once_cell = "1.18"
parking_lot = "0.12.3"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "cookies"]}
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.34", features = ["macros"] }
tokio-util = { version = "0.7", features = ["io-util"] }
url = { version = "2.5", default-features = false }
uuid = { version = "1.16", features = ["v4", "rng-rand"] }
rand = "0.9.0"
wasm-bindgen = "0.2.100"
async-trait = "0.1.88"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.1"

#
[target.wasm32-unknown-unknown.dependencies.getrandom]
version = "0.3.2"
features = ["wasm_js"]

[dev-dependencies]
chrono = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]